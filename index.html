<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimedro is getting married!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- LAYER 1: The Language Flags (Cleaned up, no text/labels) -->
    <div id="flag-selection">
        <div class="flags-container">
            <button class="flag-btn" data-lang="FR">
                <img src="images/flagFR.png" alt="French">
            </button>
            <button class="flag-btn" data-lang="ES">
                <img src="images/flagES.png" alt="Spanish">
            </button>
            <button class="flag-btn" data-lang="EN">
                <img src="images/flagUK.png" alt="English">
            </button>
        </div>
    </div>

    <!-- LAYER 2: Background Image Veil (Swapped dynamically based on device) -->
    <div id="intro-veil"></div>
        
    <!-- LAYER 3: Background Video -->
    <div id="video-container">
        <video id="wedding-video" playsinline preload="auto">
            Your browser does not support the video tag.
        </video>
        <!-- Skip Button (Hidden by default, shown when video plays) -->
        <button id="skip-btn">Skip Intro ➔</button>
    </div>
    
    <!-- LAYER 4: Template Loader / Coming Soon Screen -->
    <div class="fh5co-loader">
        <div id="coming-soon-message"></div>
    </div> 

    <script src="js/intro.js"></script>
</body>
</html>
