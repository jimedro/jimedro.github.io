<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimedro is getting married! - Under Maintenance</title>
    <style>
        /* --- Custom Font Declaration --- */
        @font-face {
            font-family: 'Nemure';
            src: url('fonts/Nemure.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nemure', Arial, sans-serif;
            -webkit-text-stroke: 0.5px currentColor;
            paint-order: stroke fill;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Moves content higher up */
            padding-top: 12vh;       /* Adjust this percentage to move it higher or lower */
            background-color: #000;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            position: relative;
        }

        /* 40% semi-transparent white overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4);
            z-index: 1;
        }

        /* Maintenance container box */
        .maintenance-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 650px;
            width: 90%;
        }

        /* Loading GIF styling (1.5x bigger: 150px -> 225px) */
        .loading-gif {
            width: 225px;
            height: auto;
            margin-bottom: 25px;
        }

        /* Message lines styling */
        .maintenance-messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .message-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            color: #000000;
            line-height: 1.4;
        }

        .flag-icon {
            width: 64px;
            height: auto;
            border-radius: 3px;
            object-fit: contain;
            display: block;
        }

        /* Responsive adjustments for phones / portrait screens */
        @media (max-width: 768px) {
            body {
                padding-top: 10vh;
            }
            .message-line {
                font-size: 17px;
                gap: 10px;
            }
            .flag-icon {
                width: 26px;
            }
            .loading-gif {
                width: 180px; /* 1.5x bigger for mobile: 120px -> 180px */
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- Loading GIF -->
        <img src="images/LOADING.gif" alt="Loading..." class="loading-gif">

        <!-- Multilingual Maintenance Messages -->
        <div class="maintenance-messages">
            <!-- French -->
            <div class="message-line">
                <img src="images/flagFR.png" alt="French Flag" class="flag-icon">
                <span>Nous sommes en maintenance, revenez plus tard svp !</span>
            </div>
            <!-- Spanish -->
            <div class="message-line">
                <img src="images/flagES.png" alt="Spanish Flag" class="flag-icon">
                <span>Estamos en mantenimiento, por favor vuelve más tarde.</span>
            </div>
            <!-- English -->
            <div class="message-line">
                <img src="images/flagUK.png" alt="English Flag" class="flag-icon">
                <span>We are under maintenance, please come back later!</span>
            </div>
        </div>
    </div>

    <script>
        // Dynamically choose landscape vs portrait background based on device screen width
        const isMobile = window.innerWidth <= 768;
        if (isMobile) {
            document.body.style.backgroundImage = "url('images/engagementdayportrait.jpg')";
        } else {
            document.body.style.backgroundImage = "url('images/engagementdaylandscape.jpg')";
        }
    </script>
</body>
</html>
